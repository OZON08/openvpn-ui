<!DOCTYPE html>
<html>
  <head>
    {{template "common/header.html" .}}
    {{template "head" .}}
  </head>
  <body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">

      <!-- Top navbar (minimal, only right-side controls) -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fa fa-bars"></i></a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <div class="theme-switcher">
              <button class="theme-btn" data-theme="light" title="Light"><i class="fas fa-sun"></i></button>
              <button class="theme-btn" data-theme="auto"  title="Auto"><i class="fas fa-adjust"></i></button>
              <button class="theme-btn" data-theme="dark"  title="Dark"><i class="fas fa-moon"></i></button>
            </div>
          </li>
          <li class="nav-item dropdown user-menu">
            <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-.15em">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
              </svg>
              <span class="d-none d-md-inline">{{ .Userinfo.Name }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-right">
              <li><a href="{{urlfor "ProfileController.Get"}}" class="dropdown-item"><i class="fas fa-user-cog mr-2"></i>Profile</a></li>
              <div class="dropdown-divider"></div>
              <li><a href="{{urlfor "LoginController.Logout"}}" class="dropdown-item"><i class="fa fa-sign-out mr-2"></i>Sign out</a></li>
            </ul>
          </li>
        </ul>
      </nav>

      {{template "common/sidebar.html" .}}

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        <section class="content pt-3">
          <div class="container-fluid">
            {{template "body" .}}
          </div>
        </section>
      </div>

      {{template "common/footer.html" .}}
    </div>
  </body>
</html>

<script>
  (function () {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(pref) {
      var isDark = pref === 'dark' || (pref === 'auto' && mq.matches);
      document.body.classList.toggle('dark-mode', isDark);
    }

    var saved = localStorage.getItem('theme') || 'auto';
    applyTheme(saved);

    mq.addEventListener('change', function () {
      if ((localStorage.getItem('theme') || 'auto') === 'auto') {
        applyTheme('auto');
      }
    });

    document.querySelectorAll('.theme-btn').forEach(function (btn) {
      if (btn.dataset.theme === saved) btn.classList.add('active');
      btn.addEventListener('click', function () {
        var pref = btn.dataset.theme;
        localStorage.setItem('theme', pref);
        document.querySelectorAll('.theme-btn').forEach(function (b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        applyTheme(pref);
      });
    });
  })();
</script>
