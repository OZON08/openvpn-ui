{{ template "layout/base.html" . }}

{{define "head"}}
<title>{{t $.Lang "UI Settings"}}</title>
{{end}}

{{define "body"}}
<div class="card card-default">
  <div class="card-header with-border">
    <h3 class="card-title">{{t $.Lang "OpenVPN UI settings"}}</h3>
    <div class="pull-right card-tools">
      <button type="button" class="btn btn-tool" data-card-widget="collapse">
        <i class="fa fa-minus"></i></button>
    </div>
  </div>
  <!-- /.card-header -->
  <!-- form start -->
  <div class="card-body">
  {{template "common/alert.html" .}}
  <form role="form" action="{{urlfor "SettingsController.Login"}}" method="post">
    <div class="card-body">
      <!-- Disabled Profile - yet another feature to implement.
      <div class="form-group">
        <label for="name">Profile</label>
        <input type="text" class="form-control" id="Profile" disabled
          value=" {{ .Settings.Profile }} ">
      </div>
      Disabled profile -->
      <div class="form-group">
        <label class="col-form-label" for="name">{{t $.Lang "Management interface address"}}</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-gear"></i></span>
          </div>
          <input type="text" class="form-control" id="MIAddress" title="{{t $.Lang "OpenVPN management interface address."}}"  name="MIAddress" placeholder="/etc/openvpn/run/mi.sock" value="{{ .Settings.MIAddress }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">{{t $.Lang "Management interface protocol"}}</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fa fa-exchange"></i></span>
          </div>
          <input type="text" class="form-control" id="MINetwork" title="{{t $.Lang "OpenVPN management interface protocol."}}" name="MINetwork" placeholder="unix" value="{{ .Settings.MINetwork }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">{{t $.Lang "OpenVPN ConfigPath"}}</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
          </div>
          <input type="text" class="form-control" id="OVConfigPath" name="OVConfigPath" title="{{t $.Lang "OpenVPN configuration path."}}" placeholder="/etc/openvpn" value="{{ .Settings.OVConfigPath }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">{{t $.Lang "EasyRSA ConfigPath"}}</label> <strong><span style="color:#337ab7" title="{{t $.Lang "New format in this version"}}">!</span></strong>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
          </div>
          <input type="text" class="form-control" id="EasyRSAPath" name="EasyRSAPath" title="{{t $.Lang "EasyRSA configuration path."}}" placeholder="/usr/share/easy-rsa" value="{{ .Settings.EasyRSAPath }}">
        </div>
      </div>

      {{ .xsrfdata }}

      <button type="submit" class="btn btn-primary" style="width: 125px;">{{t $.Lang "Save Config"}}</button>  
    </div>
        <!-- /.card-body -->
  </form>
</div>  
</div>
<!-- /.card -->
{{end}}
